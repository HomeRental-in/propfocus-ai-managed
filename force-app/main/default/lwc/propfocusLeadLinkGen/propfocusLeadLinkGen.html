<template>
    <article class="pf-shell">
        <textarea class="pf-copy-buffer" data-copy-buffer aria-hidden="true" tabindex="-1"></textarea>
        <header class="pf-header">
            <div class="pf-header-brand">
                <img src={logoUrl} alt="Propfocus" class="pf-logo" width="36" height="36" />
                <div class="pf-brand-line">
                    <span class="pf-brand">Propfocus</span>
                    <span class="pf-brand-ai">AI</span>
                </div>
            </div>
            <template lwc:if={lastReloadDisplay}>
                <span class="pf-last-reload" title="Last data refresh">{lastReloadDisplay}</span>
            </template>
        </header>
        <div class="pf-toolbar">
            <div class="pf-toolbar-row">
                <button type="button" class="pf-btn pf-btn-primary pf-btn-full" onclick={handlePrimaryMicrosite} disabled={isLoading}>{primaryMicrositeLabel}</button>
            </div>
            <div class="pf-toolbar-row pf-toolbar-row-split">
                <button type="button" class="pf-btn pf-btn-secondary" onclick={handleConfirmSiteVisit} disabled={isLoading}>Confirm Site visit</button>
                <button type="button" class="pf-btn pf-btn-secondary" onclick={handleGeneratePostVisit} disabled={isLoading}>Generate Post Visit</button>
            </div>
        </div>
        <div class="pf-body">
            <template lwc:if={showBodySpinner}>
                <div class="pf-spinner-wrap"><lightning-spinner alternative-text="Processing" size="medium"></lightning-spinner></div>
            </template>
            <template lwc:if={hasHistory}>
                <div class="pf-history">
                    <h3 class="pf-history-title">History</h3>
                    <div class="pf-history-list">
                        <template for:each={visibleHistory} for:item="item">
                            <div key={item.id} class={item.itemClass}>
                                <div class="pf-history-item-head">
                                    <span class="pf-history-type">{item.type}</span>
                                    <span class="pf-history-date">{item.createdAt}</span>
                                </div>
                                <div class="pf-history-item-foot">
                                    <div class="pf-history-meta">
                                        <span class={item.statusClass}>{item.displayStatus}</span>
                                        <span>{item.projectName}</span>
                                    </div>
                                    <template lwc:if={item.showInsightsButton}>
                                        <button
                                            type="button"
                                            class="pf-history-insights-btn"
                                            data-link-key={item.linkKey}
                                            onclick={handleViewInsights}
                                        >View insights</button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                    <template lwc:if={showHistoryToggle}>
                        <button type="button" class="pf-history-toggle" onclick={toggleHistoryExpanded}>{historyToggleLabel}</button>
                    </template>
                </div>
            </template>
            <template lwc:if={showBuyerInsightsEmbed}>
                <div class="pf-preview-section">
                    <div class="pf-preview-head">
                        <span class="pf-preview-title">Buyer Insights</span>
                        <button type="button" class="pf-toggle" onclick={togglePreviewExpanded} aria-expanded={previewExpanded}>
                            <lightning-icon icon-name={previewToggleIconName} size="x-small" alternative-text={previewToggleLabel}></lightning-icon>
                            {previewToggleLabel}
                        </button>
                    </div>
                    <div class={embedFrameClass}>
                        <iframe class={embedIframeClass} src={iframeSrc} title="Propfocus microsite preview"></iframe>
                    </div>
                </div>
            </template>
            <template lwc:else>
                <template lwc:if={missingRecordContext}>
                    <div class="pf-alert" role="alert">Add this component to a Lead or Opportunity record page to use Propfocus actions and preview.</div>
                </template>
            </template>
        </div>
    </article>
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <template lwc:if={showCopySuccess}>
                        <button type="button" class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </template>
                    <h2 class="slds-text-heading_medium pf-modal-title">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium slds-is-relative">
                    <template lwc:if={isLoading}>
                        <lightning-spinner alternative-text="Saving" size="medium" class="slds-align_absolute-center slds-m-bottom_medium"></lightning-spinner>
                    </template>
                    <template lwc:if={showCopySuccess}>
                        <p class="pf-success-hint">Copy this message and paste it into WhatsApp for your buyer.</p>
                        <textarea class="pf-success-message" data-success-message readonly></textarea>
                    </template>
                    <template lwc:else>
                    <lightning-input label="Full Name" value={clientName} onchange={handleNameChange} required></lightning-input>
                    <template lwc:if={showSiteVisitFields}>
                        <lightning-input type="datetime-local" label="Site Visit Date & Time" value={siteVisitDateTime} onchange={handleSiteVisitDateTimeChange} required></lightning-input>
                        <lightning-combobox class="slds-m-top_small" label="Project" value={siteVisitProject} options={projectOptions} placeholder="Select a project" onchange={handleSiteVisitProjectChange} required></lightning-combobox>
                        <template lwc:if={showSiteVisitManagerField}>
                            <lightning-combobox class="slds-m-top_small" label="Site Visit Manager" value={siteVisitManager} options={siteVisitManagerOptions} placeholder="None" field-level-help="Details of the manager will be shared on the visit confirmation page. Leave blank to share your details instead." onchange={handleSiteVisitManagerChange} disabled={isLoadingSiteVisitManagers}></lightning-combobox>
                        </template>
                    </template>
                    <template lwc:elseif={showPostVisitFields}>
                        <lightning-combobox label="Project" value={postVisitProject} options={projectOptions} placeholder="Select a project" onchange={handlePostVisitProjectChange} required></lightning-combobox>
                        <template lwc:if={showPostVisitConfigurationField}>
                            <template lwc:if={isLoadingPostVisitConfigurations}>
                                <div class="slds-m-top_small slds-m-bottom_small">
                                    <lightning-spinner alternative-text="Loading configurations" size="small"></lightning-spinner>
                                </div>
                            </template>
                            <lightning-dual-listbox class="slds-m-top_small" name="postVisitConfigurations" label="Visited Configuration" source-label="Available" selected-label="Selected" options={postVisitConfigurationOptions} value={postVisitSelectedConfigurations} onchange={handlePostVisitConfigurationChange} required message-when-value-missing="Select at least one configuration" disabled={isLoadingPostVisitConfigurations}></lightning-dual-listbox>
                        </template>
                        <lightning-combobox class="slds-m-top_small" label="Reassign to" value={postVisitReassignTo} options={salesTeamOptions} placeholder={postVisitReassignPlaceholder} onchange={handlePostVisitReassignChange} disabled={isLoadingSalesTeam}></lightning-combobox>
                    </template>
                    <template lwc:elseif={showMicrositeFields}>
                        <lightning-combobox label="Lead Type" value={micrositeLeadType} options={micrositeLeadTypeOptions} onchange={handleMicrositeLeadTypeChange} required></lightning-combobox>
                        <lightning-dual-listbox name="projects" label="Projects" source-label="Available" selected-label="Selected" options={projectOptions} value={selectedProjects} onchange={handleProjectChange} required message-when-value-missing="Select at least one project"></lightning-dual-listbox>
                        <template lwc:if={isLoadingConfigurations}>
                            <div class="slds-m-top_small slds-m-bottom_small">
                                <lightning-spinner alternative-text="Loading configurations" size="small"></lightning-spinner>
                            </div>
                        </template>
                        <lightning-dual-listbox name="configurations" label="Configurations" source-label="Available" selected-label="Selected" field-level-help="Optional: Leave empty to show all configurations for the selected project(s)." options={configurationOptions} value={selectedConfigurations} onchange={handleConfigurationChange} disabled={isLoadingConfigurations}></lightning-dual-listbox>
                    </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <template lwc:if={showCopySuccess}>
                        <lightning-button label={copyButtonLabel} variant="brand" onclick={handleCopySuccessMessage}></lightning-button>
                    </template>
                    <template lwc:else>
                    <lightning-button label="Cancel" variant="neutral" onclick={closeModal}></lightning-button>
                    <lightning-button label={modalSubmitLabel} variant="brand" onclick={submitGenerate} class="slds-m-left_small" disabled={isLoading}></lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
