<template>
    <lightning-card title="propfocusAI Setup" icon-name="utility:settings">
        <div class="slds-p-around_medium">
            <template lwc:if={isLoading}>
                <lightning-spinner size="small" alternative-text="Loading configuration"></lightning-spinner>
            </template>
            <template lwc:else>
                <p class="slds-text-body_small slds-m-bottom_medium">
                    Update the <strong>Propfocus Config</strong> custom metadata record named
                    <strong>Default</strong> in Setup for org id, embed URL, and field mappings.
                    <strong>Embed Base URL</strong> is subscriber-editable in
                    <strong>Setup → Custom Metadata Types → Propfocus Config → Default</strong>
                    (production default: <code>https://propfocus.in/embed/salesforce</code>;
                    sandboxes: use <code>https://dev.propfocus.in/embed/salesforce</code>).
                    Outbound API auth (Client Id / Secret) is configured under
                    <strong>Setup → Named Credentials → Propfocus API → External Credential</strong>.
                    This panel helps you verify config values and test connectivity.
                </p>
                <lightning-input label="API Named Credential" value={apiNamedCredential} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Embed Base URL" value={embedBaseUrl} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Organization Id" value={organizationId} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Logo URL" value={logoUrl} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Buyer Id Field" value={buyerIdField} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Buyer Name Field" value={buyerNameField} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Lead Status Field" value={leadStatusField} disabled></lightning-input>
                <lightning-input class="slds-m-top_small" label="Project Field" value={projectField} disabled></lightning-input>
                <div class="slds-m-top_medium">
                    <lightning-button label="Test Connection" variant="brand" onclick={handleTestConnection} disabled={isTesting}></lightning-button>
                    <template lwc:if={isTesting}>
                        <lightning-spinner class="slds-m-left_small" size="small" alternative-text="Testing"></lightning-spinner>
                    </template>
                </div>
                <template lwc:if={testResult}>
                    <div class="slds-m-top_medium"><p class={resultClass}>{testResult}</p></div>
                </template>
                <template lwc:if={inboundEndpoint}>
                    <div class="slds-m-top_large slds-p-top_medium slds-border_top">
                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Inbound Webhook Endpoint</h3>
                        <p class="slds-text-body_small slds-m-bottom_small">
                            Share this URL with PropFocus so buyer activity events can be pushed into this org.
                            PropFocus authenticates via the Connected App — this URL alone is not enough to call the endpoint.
                        </p>
                        <div class="slds-grid slds-gutters_x-small slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_10-of-12">
                                <lightning-input
                                    label="REST Endpoint URL"
                                    value={inboundEndpoint}
                                    disabled
                                    class="endpoint-input">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-align-bottom slds-p-top_small">
                                <lightning-button
                                    label={copyEndpointLabel}
                                    variant="neutral"
                                    onclick={handleCopyEndpoint}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
